#
#  The settings snicholls-tooling's checks and gate read. A repository that passes every check.

name           = snicholls-fixture
include_root   = include/snicholls/fixture
namespace      = snicholls
guard_prefix   = snicholls_fixture_
macro_prefix   = SNICHOLLS_FIXTURE_
cmake_project  = snicholls_fixture
option_prefix  = SNICHOLLS_FIXTURE_
umbrella       = fixture.hpp
docs           = yes
benchmarks     = yes
image.gcc-debug = docker/ci/Dockerfile          # the fixture's own image, derived from ubuntu-24.04
cmake.gcc-debug = -DSNICHOLLS_FIXTURE_IN_DERIVED_IMAGE=ON
