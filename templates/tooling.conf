#
#  The one file that parameterises snicholls-tooling's checks and gate for a repository. Copy it to the
#  repository's root and fill it in; every setting is described in tooling's README ("tooling.conf").
#  Format: 'key = value', one per line; '#' at the start of a line or after a space begins a comment;
#  lists are separated by spaces; flags are yes or no.

# Who the repository is
name           = snicholls-example              # the name in the gate's report
include_root   = include/snicholls/example      # the public headers (include_dir, default include, holds it)
namespace      = snicholls                      # concepts and interfaces live in it, or in one nested in it
guard_prefix   = snicholls_example_             # guards are <prefix><path under include_root>_hpp
macro_prefix   = SNICHOLLS_EXAMPLE_             # <prefix>VERSION_MAJOR, _MINOR, _PATCH in version.hpp
cmake_project  = snicholls_example              # project(<cmake_project> VERSION x.y.z)
option_prefix  = SNICHOLLS_EXAMPLE_             # <prefix>WERROR, SANITIZE, BUILD_DOCS, BUILD_BENCHMARKS
umbrella       = example.hpp                    # the umbrella header: no test or demo of its own

# The gate (scripts/test_ubuntu.sh)
docs           = yes                            # build the documentation in gcc-release
benchmarks     = yes                            # build and smoke-run the benchmarks in both Release builds
# configurations = gcc-release gcc-debug clang-release clang-debug clang-asan gcc-asan gcc15-release gcc15-asan
# cmake          = -DSNICHOLLS_EXAMPLE_WITH_X=ON
# cmake.gcc-debug = -DSNICHOLLS_EXAMPLE_EXPENSIVE_CHECKS=ON
# extra.clang-tsan = ubuntu-24.04 -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSNICHOLLS_EXAMPLE_SANITIZE=thread
# env            = ASAN_OPTIONS=detect_leaks=0
# setup          = apt-get update -qq && apt-get install -y -qq libssl-dev
# image          = docker/ci/Dockerfile         # every configuration runs in this image, FROM ${TOOLING_IMAGE}
# image.gcc-asan = docker/asan/Dockerfile       # ... or one configuration does

# The documentation site (.github/workflows/library.yml with pages: true)
# docs_html      = docs/html                    # the HTML under the documentation's build directory

# make (make/tooling.mk)
# make.demos      = scripts/run_demos.sh --all  # replaces running the CTests labelled demo
# make.benchmarks = python3 scripts/benchmarks_md.py --build build-bench   # replaces the CTests labelled benchmark

# The mirror (scripts/check_mirror.py)
# detail_needs_test  = yes                      # a detail/ header has a test (never a demo)
# mirror_ignore      = cmake fixtures data      # directories under tests/, demos/, benchmarks/ not mirrored
# mirror_listed_only = support parity           # files there need no header, but must be listed
# mirror_listed_by   = path                     # or stem, for my_add_test(<sub>/<name>) registrations

# The version (scripts/check_version.py)
# version_header = include/snicholls/example/version.hpp
# version_file.pyproject = pyproject.toml ^version\s*=\s*"(\d+\.\d+\.\d+)"

